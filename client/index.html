<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Inline SVG favicon (slate tile with a blue box mark) so the browser does not request /favicon.ico -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f172a'/%3E%3Cpath d='M16 7l8 4v10l-8 4-8-4V11z' fill='none' stroke='%233b82f6' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M8 11l8 4 8-4M16 15v10' fill='none' stroke='%233b82f6' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
  <!-- Sets data-theme before first paint to avoid a flash of the light theme.
       Keep in sync with src/composables/useTheme.js (same 'theme' key and fallback:
       stored choice, else prefers-color-scheme). -->
  <script>
    (function () {
      var theme = null;
      try {
        var stored = window.localStorage.getItem('theme');
        if (stored === 'dark' || stored === 'light') theme = stored;
      } catch (e) {}
      if (!theme) {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <title>Factory Inventory Management System</title>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
